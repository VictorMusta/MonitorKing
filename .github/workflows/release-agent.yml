# Fabrique l'agent Windows prêt à installer (autonome : .NET inclus) et le publie dans une Release GitHub.
# Déclenchement : pousser un tag de version, par exemple « git tag v0.3.0 && git push origin v0.3.0 ».
name: Release de l'agent

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Vérifier que le dashboard se charge (syntaxe, imports)
        run: node src/MonitorKing.Dashboard/check.mjs

      - name: Compiler toute la solution (agent, serveur, moteur commun)
        run: dotnet build MonitorKing.sln -c Release

      - name: Publier l'agent autonome (Windows x64)
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/MonitorKing.Agent -c Release -r win-x64 --self-contained true -p:Version=$version -o out/MonitorKing-Agent

      # L'agent publié (autonome) n'embarque pas forcément les mêmes composants que celui de développement :
      # on le lance pour de vrai et on interroge quelques routes avant de publier quoi que ce soit.
      - name: Tester l'agent publié (démarre et répond)
        shell: pwsh
        run: |
          $agent = Start-Process out/MonitorKing-Agent/MonitorKing.Agent.exe -PassThru -ArgumentList '--MonitorKing:Port=5799', "--MonitorKing:DataDirectory=$env:RUNNER_TEMP/mk-test"
          try {
            $ready = $false
            for ($i = 0; $i -lt 60 -and -not $ready; $i++) {
              Start-Sleep -Milliseconds 500
              try { $ready = (Invoke-WebRequest -UseBasicParsing http://localhost:5799/api/info).StatusCode -eq 200 } catch { }
            }
            if (-not $ready) { throw "L'agent publié ne répond pas sur /api/info" }
            foreach ($path in '/', '/api/privacy', '/api/events', '/api/breakdown?resource=cpu&minutes=30') {
              $code = (Invoke-WebRequest -UseBasicParsing "http://localhost:5799$path").StatusCode
              Write-Host "$path -> $code"
            }
          }
          finally { Stop-Process -Id $agent.Id -Force -ErrorAction SilentlyContinue }

      - name: Ajouter le script d'inscription et zipper
        shell: pwsh
        run: |
          Copy-Item deploy/agent/inscription.cmd, deploy/agent/demarrage-windows.cmd, deploy/agent/demarrage-windows.ps1 out/MonitorKing-Agent/
          Compress-Archive -Path out/MonitorKing-Agent -DestinationPath "MonitorKing-Agent-${{ github.ref_name }}-win-x64.zip"

      - name: Créer la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "MonitorKing-Agent-${{ github.ref_name }}-win-x64.zip"
          $notes = @"
          Agent MonitorKing pour Windows 10/11 64 bits, .NET inclus : rien à installer.

          1. Dézipper le dossier (par exemple dans C:\MonitorKing).
          2. Double-cliquer sur inscription.cmd et saisir le code d'inscription.
             Windows peut afficher « Windows a protégé votre ordinateur » (exécutable non signé) :
             Informations complémentaires → Exécuter quand même.
          3. Le tableau de bord local s'ouvre sur http://localhost:5757.
          4. Facultatif : demarrage-windows.cmd installe l'agent dans Program Files et le lance à chaque
             ouverture de session avec les droits administrateur (températures du processeur).

          Par défaut, les noms des applications partent sous pseudonyme (mode discret).
          "@
          gh release create "${{ github.ref_name }}" $zip --title "MonitorKing ${{ github.ref_name }}" --notes $notes
